[project]
name = "sentinel-rag"
version = "0.1.0"
description = "SentinelRAG —— 安全知识库检索 Agent：混合检索 + chunk 级引用溯源 + 分层评测"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "jieba>=0.42.1",
  "numpy>=1.26",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "pgvector>=0.3",
  "tenacity>=9.0",
]

[project.optional-dependencies]
# 本地 embedding / 重排（BGE）。缺失时 retrieval 层会明确报错并要求降级配置。
local-models = [
  "torch>=2.3",
  "transformers>=4.44",
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
