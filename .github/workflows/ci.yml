name: ci
run-name: lint + 单测 + pgvector 建表验证

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Pytest（不依赖数据库与网络的确定性单测）
        run: uv run pytest -q

  db-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - name: 建表（验证 init.sql 与 pgvector 可用）
        env:
          PGPASSWORD: sentinel
        run: |
          docker run --rm --network host -v "$PWD/sql/init.sql:/init.sql:ro" \
            -e PGPASSWORD=sentinel pgvector/pgvector:pg16 \
            psql -h localhost -U sentinel -d sentinel -f /init.sql
      - name: 校验表与索引
        env:
          PGPASSWORD: sentinel
        run: |
          docker run --rm --network host -e PGPASSWORD=sentinel pgvector/pgvector:pg16 \
            psql -h localhost -U sentinel -d sentinel -c "\dt" -c "select extname, extversion from pg_extension;"
      - name: 存储层单测（连真实 Postgres）
        env:
          DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel
        run: uv run pytest -q tests/test_storage.py
